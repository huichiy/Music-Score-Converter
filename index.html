<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jianpu Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8Y7YGRHXP7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8Y7YGRHXP7');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
  <style>
    /* ── Themes ─────────────────────────────────────────────── */
    :root {
      --bg:         #EFE5D2;
      --surface:    #FAF4EA;
      --sidebar:    #E4D4BC;
      --border:     #C4AD90;
      --border-dim: rgba(196,173,144,0.35);
      --accent:     #B01C1C;
      --text:       #1C0F06;
      --muted:      #8A6848;
      --faint:      #C4AD90;
      --sel-bg:     #D4C0A4;
      --load-bg:    #D4C0A4;
    }

    [data-theme="dark"] {
      --bg:         #100E08;
      --surface:    #18120A;
      --sidebar:    #140F08;
      --border:     #2C2010;
      --border-dim: rgba(44,32,16,0.55);
      --accent:     #DC2626;
      --text:       #E8D4A0;
      --muted:      #6B5030;
      --faint:      #3A2C18;
      --sel-bg:     #1C160A;
      --load-bg:    #1C160A;
    }

    /* ── Reset & Base ────────────────────────────────────────── */
    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.25s, color 0.25s;
    }

    /* ── Theme Toggle (in sidebar) ───────────────────────────── */
    .theme-toggle {
      display: flex; align-items: center; gap: 8px;
      background: var(--sel-bg);
      border: 0.5px solid var(--border);
      border-radius: 4px;
      cursor: pointer; color: var(--muted);
      padding: 7px 10px; width: 100%;
      font-family: 'Inter', sans-serif; font-size: 11px;
      transition: color 0.2s, background 0.2s;
      margin-bottom: 10px;
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--text); }
    .theme-toggle svg { width: 14px; height: 14px; flex-shrink: 0; }
    .theme-toggle-label { flex: 1; text-align: left; }

    /* ── Layout ──────────────────────────────────────────────── */
    .layout { flex: 1; display: flex; min-height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: 224px; flex-shrink: 0;
      background: var(--sidebar);
      border-right: 0.5px solid var(--border);
      padding: 24px 16px;
      display: flex; flex-direction: column;
      transition: background 0.25s, border-color 0.25s;
    }

    /* Logo */
    .logo-glyph {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px; letter-spacing: 7px;
      color: var(--accent); margin-bottom: 3px; line-height: 1;
    }
    .logo-sub { font-size: 11px; color: var(--muted); }
    .logo-divider { height: 0.5px; background: var(--border); margin: 16px 0; }

    /* Sections */
    .sidebar-sec { margin-bottom: 18px; }

    .sec-label {
      font-size: 10px; color: var(--faint);
      letter-spacing: 0.3px; margin-bottom: 8px; font-weight: 500;
    }

    /* Loaded file card */
    .loaded-card {
      background: var(--load-bg);
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .loaded-card-info { flex: 1; min-width: 0; }
    .loaded-tag { display: block; font-size: 9px; color: var(--muted); margin-bottom: 2px; }
    .loaded-name {
      display: block; font-size: 12px; color: var(--text);
      font-family: monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reset-btn {
      flex-shrink: 0;
      background: transparent; border: none;
      color: var(--muted); font-size: 16px; line-height: 1;
      cursor: pointer; padding: 0 2px;
      transition: color 0.15s;
    }
    .reset-btn:hover { color: var(--accent); }

    /* Upload zone — compact */
    .upload-zone {
      border: 1px dashed var(--border);
      border-radius: 6px; padding: 14px 10px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      text-align: center; cursor: default;
      transition: border-color 0.2s;
    }
    .upload-zone.dragover { border-color: var(--accent); }
    .upload-char { font-size: 20px; color: var(--faint); line-height: 1; margin-bottom: 2px; }
    .upload-hint { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .upload-or { font-size: 10px; color: var(--faint); }
    .browse-label {
      font-size: 11px; color: var(--accent); cursor: pointer;
      border-bottom: 0.5px solid var(--accent); padding-bottom: 1px;
    }
    input[type="file"] { display: none; }

    /* Option rows */
    .option-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 0.5px solid var(--border-dim);
    }
    .opt-label { font-size: 12px; color: var(--muted); }
    .opt-val   { font-size: 12px; color: var(--text); font-family: monospace; }

    .part-selector {
      background: var(--sel-bg); color: var(--text);
      border: 0.5px solid var(--border);
      padding: 3px 6px; border-radius: 3px;
      font-family: 'Inter', sans-serif; font-size: 11px;
      outline: none; cursor: pointer; max-width: 110px;
    }

    .auto-detect-label {
      font-size: 10px; color: var(--muted); margin-top: 5px; font-style: italic;
    }

    /* Convert button */
    .convert-btn {
      width: 100%; margin-top: 4px;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 500;
      padding: 10px; border-radius: 4px; border: none;
      cursor: pointer;
      font-family: Georgia, serif; letter-spacing: 0.5px;
      transition: opacity 0.2s, background 0.2s, border 0.2s, color 0.2s;
    }
    .convert-btn:hover:not(:disabled) { opacity: 0.85; }
    .convert-btn:disabled {
      background: transparent; color: var(--faint);
      border: 0.5px solid var(--border); cursor: not-allowed;
      font-family: 'Inter', sans-serif; letter-spacing: 0;
    }

    /* Error */
    .error-message {
      font-size: 11px; color: var(--accent);
      padding: 6px 2px; display: none; text-align: center;
    }

    /* Export */
    .download-group { display: flex; gap: 6px; }
    .download-btn {
      flex: 1; background: var(--sel-bg); color: var(--text);
      border: 0.5px solid var(--border);
      padding: 6px 0; border-radius: 3px;
      font-family: 'Inter', sans-serif; font-size: 11px;
      cursor: pointer; transition: border-color 0.2s; text-align: center;
    }
    .download-btn:hover { border-color: var(--text); }

    /* Try sample button */
    .try-sample-btn {
      width: 100%; margin-top: 6px;
      background: transparent; color: var(--muted);
      border: none; padding: 4px 0;
      font-family: 'Inter', sans-serif; font-size: 10px;
      cursor: pointer; text-align: center;
      transition: color 0.2s;
    }
    .try-sample-btn:hover { color: var(--accent); }

    /* Ko-fi donation button */
    .kofi-btn {
      display: block; text-align: center;
      font-size: 11px; color: var(--muted);
      text-decoration: none; padding: 6px 0;
      border: 0.5px solid var(--border); border-radius: 3px;
      margin-bottom: 8px; transition: color 0.2s, border-color 0.2s;
    }
    .kofi-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* Sidebar footer */
    .sidebar-footer {
      margin-top: auto; padding-top: 16px;
      font-size: 10px; color: var(--faint); line-height: 1.7;
      border-top: 0.5px solid var(--border-dim);
    }

    /* ── Main content ────────────────────────────────────────── */
    .main-content {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }

    /* Toolbar */
    .toolbar {
      padding: 13px 20px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0; transition: background 0.25s, border-color 0.25s;
    }
    .toolbar-title { font-family: Georgia, serif; font-size: 14px; color: var(--text); }
    .toolbar-sep   { color: var(--faint); font-size: 12px; }
    .toolbar-meta  { font-size: 12px; color: var(--muted); font-family: monospace; }
    .toolbar-done  {
      margin-left: auto; font-size: 10px; color: var(--accent);
      border: 0.5px solid var(--accent); border-radius: 3px;
      padding: 2px 8px; opacity: 0.8;
    }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px;
    }
    .empty-glyph { font-size: 48px; color: var(--faint); line-height: 1; margin-bottom: 16px; }
    .empty-text  { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 6px; }
    .empty-sub   { font-size: 12px; color: var(--faint); font-style: italic; text-align: center; }

    /* Score output */
    .output-zone {
      flex: 1; padding: 24px 20px;
      overflow-x: auto; overflow-y: auto;
      background: var(--surface);
      transition: background 0.25s;
    }

    /* ── Mobile ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      /* Stack sidebar above main content */
      .layout {
        flex-direction: column;
        min-height: 100vh;
      }

      /* Sidebar becomes full-width top panel */
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 0.5px solid var(--border);
        padding: 14px 16px;
      }

      /* Compact logo row */
      .logo-glyph {
        font-size: 22px;
        letter-spacing: 5px;
        display: inline;
      }
      .logo-sub {
        display: inline;
        font-size: 10px;
        margin-left: 8px;
        vertical-align: middle;
      }
      .logo-divider { margin: 10px 0; }

      /* More compact upload zone */
      .upload-zone { padding: 12px 10px; }
      .upload-char { font-size: 16px; }

      /* Part selector: allow full width */
      .part-selector { max-width: none; flex: 1; }

      /* Convert button: slightly smaller */
      .convert-btn { padding: 9px; font-size: 12px; }

      /* Sidebar footer: keep theme toggle, hide credit text */
      .sidebar-footer {
        margin-top: 0;
        padding-top: 12px;
        font-size: 0;   /* hides the raw text nodes */
        line-height: 0;
      }
      /* Restore font inside the toggle button itself */
      .sidebar-footer .theme-toggle {
        font-size: 11px;
        line-height: normal;
        margin-bottom: 0;
      }

      /* Main content: needs a minimum height so the empty state shows */
      .main-content {
        min-height: 50vh;
        overflow: visible;
      }

      /* Toolbar: allow wrapping on narrow screens */
      .toolbar {
        padding: 10px 14px;
        flex-wrap: wrap;
        gap: 4px;
      }
      .toolbar-title { font-size: 13px; }
      .toolbar-done  { margin-left: 0; }

      /* Empty state: less padding */
      .empty-state { padding: 28px 16px; }
      .empty-glyph { font-size: 36px; margin-bottom: 12px; }
      .empty-text  { font-size: 13px; }
      .empty-sub   { font-size: 11px; }

      /* Output zone: less padding */
      .output-zone { padding: 14px 12px; }
    }
  </style>
</head>
<body>

  <div class="layout">

    <!-- ── Sidebar ───────────────────────────────────────────── -->
    <aside class="sidebar">

      <div class="logo-glyph">简谱</div>
      <div class="logo-sub">Jianpu Converter</div>
      <div class="logo-divider"></div>

      <!-- File -->
      <div class="sidebar-sec">
        <div class="sec-label">文件 · File</div>

        <div class="loaded-card" id="loadedCard" style="display:none">
          <div class="loaded-card-info">
            <span class="loaded-tag">已加载 Loaded</span>
            <span class="loaded-name" id="fileNameDisplay">—</span>
          </div>
          <button class="reset-btn" id="resetBtn" title="重置 Reset">×</button>
        </div>

        <div class="upload-zone" id="dropzone">
          <div class="upload-char">♩</div>
          <div class="upload-hint">拖放 .xml, .mxl, .mid</div>
          <div class="upload-or">或 · or</div>
          <label class="browse-label">
            浏览 Browse
            <input type="file" id="fileInput" accept=".xml,.mxl,.mid,.midi,text/xml,application/xml,audio/midi,audio/x-midi,application/octet-stream">
          </label>
        </div>
        <button class="try-sample-btn" id="trySampleBtn">↳ 试用示例 · Try sample</button>
      </div>

      <!-- Options — shown after file loaded -->
      <div class="sidebar-sec" id="optionsSec" style="display:none">
        <div class="sec-label">设置 · Options</div>

        <div class="option-row">
          <span class="opt-label">声部 Part</span>
          <div id="partSelectorContainer" style="display:none">
            <select class="part-selector" id="partSelector">
              <option value="0">Part 1</option>
            </select>
          </div>
          <span id="partFallback" class="opt-val" style="display:none">—</span>
        </div>

        <div class="option-row">
          <span class="opt-label">调号 Key</span>
          <span class="opt-val" id="keyDisplay">—</span>
        </div>

        <div class="option-row">
          <span class="opt-label">拍号 Metre</span>
          <span class="opt-val" id="timeDisplay">—</span>
        </div>

        <div class="auto-detect-label" id="autoDetectLabel" style="display:none">↑ Auto-detected melody</div>
      </div>

      <!-- Convert -->
      <button class="convert-btn" id="convertBtn" disabled>转换 Convert</button>
      <div class="error-message" id="errorMsg"></div>

      <!-- Export — shown after conversion -->
      <div class="sidebar-sec" id="exportSec" style="display:none; margin-top:12px;">
        <div class="sec-label">导出 · Export</div>
        <div class="download-group">
          <button class="download-btn" id="dlPng">.PNG</button>
          <button class="download-btn" id="dlJpeg">.JPEG</button>
        </div>
      </div>

      <div class="sidebar-footer">
        <a class="kofi-btn" href="https://ko-fi.com/huichiyap" target="_blank" rel="noopener">☕ Support on Ko-fi</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme"
          onclick="(function(){
            var h = document.documentElement;
            var isDark = h.getAttribute('data-theme') === 'dark';
            h.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? '切换到墨夜 · Dark' : '切换到竹简 · Light';
            document.getElementById('themeIcon').innerHTML = isDark
              ? '<circle cx=\'12\' cy=\'12\' r=\'5\'></circle><line x1=\'12\' y1=\'1\' x2=\'12\' y2=\'3\'></line><line x1=\'12\' y1=\'21\' x2=\'12\' y2=\'23\'></line><line x1=\'4.22\' y1=\'4.22\' x2=\'5.64\' y2=\'5.64\'></line><line x1=\'18.36\' y1=\'18.36\' x2=\'19.78\' y2=\'19.78\'></line><line x1=\'1\' y1=\'12\' x2=\'3\' y2=\'12\'></line><line x1=\'21\' y1=\'12\' x2=\'23\' y2=\'12\'></line><line x1=\'4.22\' y1=\'19.78\' x2=\'5.64\' y2=\'18.36\'></line><line x1=\'18.36\' y1=\'5.64\' x2=\'19.78\' y2=\'4.22\'></line>'
              : '<path d=\'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\'></path>';
          })()">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="theme-toggle-label" id="themeLabel">切换到竹简 · Light</span>
        </button>
        简谱 Jianpu Converter<br>
        Built for Chinese orchestra musicians
      </div>

    </aside>

    <!-- ── Main content ──────────────────────────────────────── -->
    <main class="main-content" id="mainContent">

      <div class="toolbar" id="toolbar" style="display:none">
        <span class="toolbar-title" id="toolbarTitle"></span>
        <span class="toolbar-sep">·</span>
        <span class="toolbar-meta" id="toolbarMeta"></span>
        <span class="toolbar-done" id="toolbarDone" style="display:none">✓ 完成</span>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-glyph">♩</div>
        <div class="empty-text">上传文件后，简谱将显示在这里</div>
        <div class="empty-sub">Score output appears here after conversion</div>
      </div>

      <div class="output-zone" id="output" style="display:none"></div>

    </main>
  </div>

  <script src="js/parser.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/downloader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
