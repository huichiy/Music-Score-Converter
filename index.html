<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jianpu Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Serif+Display&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <style>
        :root {
            --bg: #F7F5F2;
            --surface: #FFFFFF;
            --border: rgba(0, 0, 0, 0.12);
            --accent: #9F1239;
            --gold: #B8943A;
            --text: #0A0A0A;
            --text-muted: #6B6B6B;
            --btn-bg: #0A0A0A;
            --btn-text: #FFFFFF;
            --select-bg: #EDE9E3;
        }

        [data-theme="dark"] {
            --bg: #0A0908;
            --surface: #131210;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #9F1239;
            --gold: #C9A84C;
            --text: #F0EDE6;
            --text-muted: #6B6865;
            --btn-bg: #F0EDE6;
            --btn-text: #0A0908;
            --select-bg: #1C1A17;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }

        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .theme-toggle:hover {
            color: var(--text);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding-top: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding-bottom: 80px;
            position: relative;
        }

        /* Dizi decoration */
        .decoration-dizi {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%) rotate(-15deg);
            width: 680px;
            opacity: 0.12;
            pointer-events: none;
            color: var(--text);
        }

        [data-theme="dark"] .decoration-dizi {
            opacity: 0.07;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .badge {
            background: var(--accent);
            color: #FFFFFF;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 14px;
            letter-spacing: 3px;
            padding: 4px 16px;
            border-radius: 999px;
            margin-bottom: 24px;
        }

        .title {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-size: 48px;
            letter-spacing: -1px;
            margin: 0 0 14px 0;
            text-align: center;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 56px 0;
            text-align: center;
            line-height: 1.65;
            max-width: 360px;
        }

        .upload-zone {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 52px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.25s, background 0.25s;
            position: relative;
            background: var(--surface);
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--gold);
        }

        .upload-icon {
            width: 28px;
            height: 28px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.2;
            margin-bottom: 14px;
            transition: stroke 0.25s;
        }

        .upload-zone:hover .upload-icon {
            stroke: var(--gold);
        }

        .upload-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .upload-or {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .browse-label {
            color: var(--gold);
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
            position: relative;
        }

        .browse-label:hover {
            opacity: 0.75;
        }

        .browse-label::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--gold);
            opacity: 0.4;
        }

        input[type="file"] {
            display: none;
        }

        .convert-btn {
            width: 100%;
            margin-top: 16px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 14px;
            font-weight: 500;
            padding: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, background 0.2s, color 0.2s, border 0.2s;
            letter-spacing: 0.2px;
        }

        .convert-btn:hover:not(:disabled) {
            opacity: 0.85;
        }

        .convert-btn:disabled {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
        }

        .output-zone {
            width: 100%;
            margin-top: 32px;
            padding: 24px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 2.2;
            white-space: pre-wrap;
            display: none;
            overflow-x: auto;
            color: var(--text);
        }

        .output-zone svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .error-message {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(159, 18, 57, 0.08);
            color: var(--accent);
            border: 1px solid rgba(159, 18, 57, 0.2);
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .controls-row {
            width: 100%;
            display: none;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        .part-selector {
            background: var(--select-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .auto-detect-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            margin-left: 2px;
            display: none;
            position: absolute;
            top: 100%;
        }

        .part-selector-container {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .download-group {
            display: flex;
            gap: 8px;
        }

        .download-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .download-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .footer {
            margin-top: auto;
            padding-top: 24px;
            padding-bottom: 40px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            width: 100%;
            border-top: 1px solid var(--border);
        }

        .kofi-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 8px 18px;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
            letter-spacing: 0.2px;
        }

        .kofi-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }

        .kofi-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 80px;
                padding-left: 20px;
                padding-right: 20px;
                padding-bottom: 60px;
            }

            .title {
                font-size: 36px;
                letter-spacing: -0.5px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 40px;
            }

            .upload-zone {
                padding: 36px 20px;
            }

            .controls-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .download-group {
                width: 100%;
                justify-content: flex-start;
            }

            .download-btn {
                flex: 1;
                text-align: center;
            }

            .theme-toggle {
                top: 16px;
                right: 16px;
            }

            .decoration-dizi {
                display: none;
            }
        }
    </style>
</head>

<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <!-- Sun icon default -->
        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Will switch via JS -->
        </svg>
    </button>

    <div class="container">
        <!-- Dizi decorative illustration -->
        <svg class="decoration-dizi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Tube body -->
            <rect x="10" y="22" width="280" height="16" rx="8"/>
            <!-- End cap -->
            <ellipse cx="10" cy="30" rx="4" ry="8"/>
            <!-- Blow hole -->
            <ellipse cx="50" cy="30" rx="5" ry="6"/>
            <!-- Membrane hole -->
            <ellipse cx="72" cy="30" rx="4" ry="5"/>
            <!-- 6 finger holes -->
            <circle cx="106" cy="30" r="4"/>
            <circle cx="126" cy="30" r="4"/>
            <circle cx="146" cy="30" r="4"/>
            <circle cx="172" cy="30" r="4"/>
            <circle cx="192" cy="30" r="4"/>
            <circle cx="212" cy="30" r="4"/>
        </svg>

        <header>
            <span class="badge">简谱</span>
            <h1 class="title">Jianpu Converter</h1>
            <p class="subtitle">Convert MusicXML scores to Jianpu numbered notation</p>
        </header>

        <div class="upload-zone" id="dropzone">
            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="upload-text" id="fileNameDisplay">Drop your .xml, .mxl, or .mid file here</div>
            <div class="upload-or">or</div>
            <label class="browse-label">
                Browse files
                <input type="file" id="fileInput" accept=".xml,.mxl,.mid,.midi">
            </label>
        </div>

        <button class="convert-btn" id="convertBtn" disabled>Convert to Jianpu</button>
        <div class="error-message" id="errorMsg"></div>

        <div class="controls-row" id="controlsRow">
            <div class="part-selector-container" id="partSelectorContainer">
                <select class="part-selector" id="partSelector">
                    <option value="0">Part 1</option>
                </select>
                <div class="auto-detect-label" id="autoDetectLabel">Auto-detected melody line</div>
            </div>

            <div class="download-group">
                <button class="download-btn" id="dlPng">.PNG</button>
                <button class="download-btn" id="dlJpeg">.JPEG</button>
            </div>
        </div>

        <div class="output-zone" id="output"></div>
    </div>

    <div class="footer">
        <a class="kofi-btn" href="https://ko-fi.com/huichiyap" target="_blank" rel="noopener">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <!-- Steam lines -->
                <path d="M8,3 Q9,1 8,0"/>
                <path d="M12,3 Q13,1 12,0"/>
                <!-- Cup body -->
                <path d="M5,6 L6,18 Q6,20 8,20 L16,20 Q18,20 18,18 L19,6 Z"/>
                <!-- Handle -->
                <path d="M19,9 Q23,9 23,13 Q23,17 19,17"/>
                <!-- Saucer -->
                <line x1="4" y1="20" x2="20" y2="20"/>
            </svg>
            Buy me a coffee
        </a><br>
        简谱 Jianpu Converter · Built for Chinese orchestra musicians
    </div>

    <script src="js/parser.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/downloader.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
